[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
pythonpath = .

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    # --cov-fail-under=80  # Enable (and ratchet up) once coverage is established

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, mocked dependencies)
    integration: Integration tests (DB + services)
    e2e: End-to-end tests (full API workflows)
    slow: Tests that take significant time to run
    ml: Machine learning model tests
    external: Tests requiring external services (S3, APIs)

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/test.log
log_file_level = DEBUG

# Asyncio configuration
asyncio_default_fixture_loop_scope = function
