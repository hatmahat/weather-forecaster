# TEMPLATE: replace every YOUR_* placeholder before use. See production-deployment.yaml for notes.
#
# Release-candidate flow: tag `vX.Y.Z-rcN` -> validate tag -> build & push image -> deploy to staging.
name: Staging Deployment

on:
  push:
    tags: [ 'v*.*.*-rc*' ]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    uses: YOUR_ORG/YOUR_WORKFLOWS_REPO/.github/workflows/validate-rc-tag.yaml@main
    with:
      tag: ${{ github.ref_name }}

  build:
    needs: validate
    uses: YOUR_ORG/YOUR_WORKFLOWS_REPO/.github/workflows/build-push.yaml@main
    with:
      image_tag: ${{ github.ref_name }}
      ecr_repository: YOUR_ECR_REPOSITORY
      aws_region: YOUR_AWS_REGION
      environment: staging
      build_args: |
        INSTALL_TORCH="${{ vars.INSTALL_TORCH }}"
        USE_GPU="${{ vars.USE_GPU }}"
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_IAM_ROLE_ARN: ${{ secrets.AWS_IAM_ROLE_ARN }}

  deploy:
    needs: build
    uses: YOUR_ORG/YOUR_WORKFLOWS_REPO/.github/workflows/deploy-ec2.yaml@main
    with:
      image_tag: ${{ github.ref_name }}
      ecr_repository: YOUR_ECR_REPOSITORY
      aws_region: YOUR_AWS_REGION
      environment: staging
      deploy_path: /opt/apps/YOUR_APP_DIR
      target_tag_key: Name
      target_tag_value: YOUR_EC2_NAME_TAG_STAGING
    secrets: inherit
